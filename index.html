<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سامانه هوشمند مسابقات</title>
    
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body x-data="app()" 
      class="text-slate-800 min-h-screen flex flex-col relative bg-slate-50 transition-all duration-500"
      :class="systemConfig.bgImage ? 'bg-custom' : ''"
      :style="systemConfig.bgImage ? `background-image: url('${systemConfig.bgImage}');` : ''">

    <!-- Include Components -->
    <div id="toast-container" x-html="toastComponent"></div>
    <div id="modal-container" x-html="modalComponent"></div>
    <div id="navbar" x-show="showNavbar" x-html="navbarComponent"></div>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-lg mx-auto pb-safe relative z-10" x-html="currentPage"></main>

    <audio x-ref="bgMusic" loop class="hidden"></audio>

    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/api.js"></script>
    <script src="/js/components/auth.js"></script>
    <script src="/js/components/quiz.js"></script>
    <script src="/js/components/profile.js"></script>
    <script src="/js/components/admin.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
